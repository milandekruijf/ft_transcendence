services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ft_transcendence_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      SERVER_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ft_transcendence_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-secret-change-in-production}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN}
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Transcendence123!}
      SEED_DIDI_PASSWORD: ${SEED_DIDI_PASSWORD:-Qwerty123!}
      SEED_HOMER_PASSWORD: ${SEED_HOMER_PASSWORD:-Simpsons123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health answers only once the app is listening, i.e. after the startup
    # migrations in DatabaseService have run. The seed waits for this.
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: runs the backend database migrations before the app is started.
  # Exits 0 when done; `docker compose up` keeps the stack running.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    container_name: ft_transcendence_migrate
    restart: 'no'
    working_dir: /app/apps/backend
    command: ['bun', 'run', 'migrate']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-secret-change-in-production}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: creates the demo accounts and events (apps/backend/seed.ts, which
  # skips anything that already exists) once the backend has migrated the
  # database. Exits 0 when done; `docker compose up` keeps the stack running.
  seed:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    container_name: ft_transcendence_seed
    restart: 'no'
    working_dir: /app/apps/backend
    command: ['bun', 'seed.ts']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-secret-change-in-production}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Transcendence123!}
      SEED_DIDI_PASSWORD: ${SEED_DIDI_PASSWORD:-Qwerty123!}
      SEED_HOMER_PASSWORD: ${SEED_HOMER_PASSWORD:-Simpsons123!}
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ft_transcendence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ft_transcendence_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: ft_transcendence_caddy
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT}
      HTTPS_PORT: ${HTTPS_PORT}
    ports:
      - '${HTTPS_PORT}:${HTTPS_PORT}'
      - '${HTTP_PORT}:${HTTP_PORT}'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/certs:/certs:ro
      - caddy_data:/data
    # Use the local certificate when one is present (mkcert, see
    # scripts/generate-certs.sh), otherwise let Caddy issue its own so a fresh
    # clone starts without any certificate in the repository.
    command:
      - sh
      - -c
      - |
        if [ -f /certs/local.pem ] && [ -f /certs/local-key.pem ]; then
          echo 'tls /certs/local.pem /certs/local-key.pem' > /etc/caddy/tls.caddy
        else
          echo 'tls internal' > /etc/caddy/tls.caddy
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      - frontend
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: ft_transcendence_mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT}:1025'
      - '${MAILPIT_UI_PORT}:8025'
volumes:
  postgres_data:
  redis_data:
  caddy_data:
